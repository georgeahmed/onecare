__meta:
  arrayMerge:
    enhanced_access_windows: additive
    red_flag_set: additive
    accessibility_and_language.interpreter_languages: additive
    accessibility_and_language.collect_patient_prefs: additive
core_hours:
  start: 08:00
  end: '18:30'
enhanced_access_windows:
- weekdays_evening
- saturday
enhanced_access:
  timezone: Europe/London
  windows:
  - name: weekdays_evening
    days:
    - 1
    - 2
    - 3
    - 4
    - 5
    start: '18:30'
    end: '20:30'
  - name: saturday
    days:
    - 6
    start: 09:00
    end: '12:00'
  allowed_slot_types:
  - EA
  - ENHANCED_ACCESS
  fairness:
    max_per_organisation: 3
red_flag_set: []
red_flag_source: core
priority_thresholds:
  stat: 0.9
  urgent: 0.7
  soon: 0.4
  routine: 0.0
sla_targets:
  stat_immediate: PT0M
  urgent_first_contact: PT2H
  soon_same_day: PT12H
  routine_initial_response: P2D
hold_back_fraction: 0.1
release_max_fraction: 0.05
release_delta_threshold: 4
release_confidence_threshold: 0.65
release_min_hold_fraction: 0.04
forecast_horizon_minutes: 180
fairness_floors:
  telephone_min_fraction: 0.15
  interpreter_support: true
privacy_policy:
  retention_days: 3650 # PHI (special category data) retention in days (10 years)
  minimize_data: true
ooh_policy:
  accept_submissions: true
  patient_message: 'Outside core hours. For urgent medical help, contact NHS 111 (24/7)
    or call 999 for emergencies. You may submit your issue now and we will review
    it when we re-open.

    '
access_gate:
  rate_limit:
    tenant:
      capacity: 120
      refill_per_second: 2
      ttl_seconds: 600
      max_entries: 2000
    account:
      capacity: 12
      refill_per_second: 0.3
      ttl_seconds: 600
      max_entries: 10000
callback_windows_by_priority:
  stat: immediate
  urgent: within_2h
  soon: same_day
  routine: within_48h
accessibility_and_language:
  interpreter_languages:
  - en
  - ur
  - pa
  - pl
  - ar
  offer_bsl: true
  collect_patient_prefs:
  - remember_interpreter
  ivr_prompt_keys:
    intro: ivr.prompt.language.select
    confirm: ivr.prompt.language.confirm
    options:
      en: ivr.prompt.language.option.en
      ur: ivr.prompt.language.option.ur
      pa: ivr.prompt.language.option.pa
      pl: ivr.prompt.language.option.pl
      ar: ivr.prompt.language.option.ar
    fallback_option: ivr.prompt.language.option.en
safety_gate:
  model_ner: bioclinicalbert
  model_classifier: medalpaca-sm
  multilingual_mode: native
  translate_engine: none
  red_flag_threshold: 0.65
  emergency_confidence: 0.7
  acuity_model: xgboost
  acuity_threshold_emergency: 0.75
  timeout_ms: 800
  fallback: rules
triage:
  score_weights:
    acuity: 1.0
    risk: 0.5
    complexity: 0.2
    time: 0.5
    capacity: 0.2
  score_calibration:
    slope: 1.0
    intercept: 0.0
    min: 0.0
    max: 1.0
  priority_tiebreaker:
    epsilon: 0.02
    acuity_promotion: 0.8
  fallback:
    enabled: true
    time_budget_ms: 120
    score_delta_tolerance: 0.15
    max_reasons: 5
  aging_interval: PT5M
  sim_threshold: 0.8
  dedup_window: PT72H
provider_assignment:
  weights:
    availability: 1.0
    workload: 1.0
    continuity: 0.5
    resolution_rate: 0.2
    distance: 0.2
    fairness: 0.5
  fairness:
    max_share: 0.6
telephony:
  ivr_intent_classifier: default
  max_callback_retries: 3
  emergency_transfer_enabled: true
  audio:
    retention_days: 30
  asr:
    endpoint: https://telephony-asr.example.invalid/v1/transcribe
    timeout_ms: 5000
    max_retries: 2
    base_delay_ms: 150
    host_allowlist:
      - telephony-asr.example.invalid
    cb_failure_threshold: 5
    cb_cooldown_ms: 15000
    lang_detect: true
    diarization: false
  callback_windows_by_priority:
    stat:
      - code: immediate
        label: We will connect you immediately.
    urgent:
      - code: within_2h
        label: We can call you back within 2 hours.
    soon:
      - code: same_day
        label: We can call you back later today.
    routine:
      - code: within_48h
        label: We can call you back within 48 hours.
  concurrency:
    max_concurrent_transcriptions: 32
  rate_limit:
    caller:
      capacity: 4
      refill_per_second: 0.2
      ttl_seconds: 600
      max_entries: 20000
    practice:
      capacity: 80
      refill_per_second: 2
      ttl_seconds: 600
      max_entries: 200
ambient_scribe:
  enabled: true
  asr_model: whisper-large-v3-medical
  asr_diarization: true
  llm_model: medpalm2
  max_summary_tokens: 2048
  uncertainty_highlight: true
  require_clinician_approval: true
  store_audio: binary
  terminology:
    condition: SNOMED-CT
    medication: dm+d
  timeout_ms: 30000
  fallback_mode: transcript
security:
  audit_all_events: true
  worm_audit_store: true
  auth_required: true
  encryption: TLS1.2+
observability:
  metrics_collection: true
  slo:
    triage_p95_ms: 2000
    scribe_draft_p95_s: 60
    portal_core_uptime: 0.999
    audit_coverage: 1.0
  alerts:
    triage_latency_breach:
      threshold_ms: 2000
      duration: PT5M
    scribe_backlog:
      threshold_queue_length: 5
      duration: PT1M
    portal_downtime:
      threshold_minutes: 5
    fairness_monitor:
      telephone_fraction_floor: 0.15
      check_window: P1D
idempotency:
  ttl_seconds: 600
messaging:
  send_document:
    mesh:
      workflow_id: "GPCONNECT_SEND_DOCUMENT"
      ack_workflow_id: "GPCONNECT_SEND_DOCUMENT_ACK"
      sender_mailbox: "CHANGE_ME"
      ack_timeout_minutes: 30
      max_retries: 5
      backoff_schedule:
        - "PT1M"
        - "PT5M"
        - "PT15M"
        - "PT1H"
        - "PT3H"
    pds_lookup: true
    pdf_max_mb: 10
feature_flags:
  gp_connect_booking: false
