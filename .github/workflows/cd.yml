name: CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container image tag or digest
        required: false
        default: "${{ github.sha }}"
      promote_production:
        description: Promote to production after staging
        type: boolean
        default: false

env:
  HELM_CHART: infra/k8s/helm/onecare-service

jobs:
  verify-signatures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Verify container signatures
        env:
          COSIGN_EXPERIMENTAL: "1"
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          if [ -z "${COSIGN_PUBLIC_KEY:-}" ]; then
            echo "::warning title=Cosign::COSIGN_PUBLIC_KEY not configured; skipping verification"
            exit 0
          fi
          set -euo pipefail
          cosign verify --key env://COSIGN_PUBLIC_KEY ghcr.io/onecare/orchestrator:${{ inputs.image_tag }}
          cosign verify --key env://COSIGN_PUBLIC_KEY ghcr.io/onecare/booking:${{ inputs.image_tag }}
          cosign verify --key env://COSIGN_PUBLIC_KEY ghcr.io/onecare/ics-hub:${{ inputs.image_tag }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: verify-signatures
    environment:
      name: staging
    env:
      KUBECONFIG: ${{ runner.temp }}/kubeconfig
      IMAGE_TAG: ${{ inputs.image_tag }}
      STAGING_NAMESPACE: ${{ secrets.STAGING_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_STAGING }}" ]; then
            echo "KUBE_CONFIG_STAGING secret missing" >&2
            exit 1
          fi
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 --decode > "$KUBECONFIG"
      - name: Validate staging inputs
        run: |
          if [ -z "${STAGING_NAMESPACE}" ]; then
            echo "STAGING_NAMESPACE secret missing" >&2
            exit 1
          fi
          if [ -z "${{ secrets.STAGING_BASE_URL }}" ]; then
            echo "STAGING_BASE_URL secret missing" >&2
            exit 1
          fi
      - name: Deploy orchestrator (staging)
        run: |
          helm upgrade --install orchestrator $HELM_CHART \
            --namespace "$STAGING_NAMESPACE" \
            --values apps/orchestrator/k8s/values.yaml \
            --values apps/orchestrator/k8s/values-staging.yaml \
            --set image.repository=ghcr.io/onecare/orchestrator \
            --set image.tag="$IMAGE_TAG" \
            --atomic --create-namespace
          kubectl rollout status deploy/orchestrator -n "$STAGING_NAMESPACE" --timeout=120s
      - name: Deploy booking (staging)
        run: |
          helm upgrade --install booking $HELM_CHART \
            --namespace "$STAGING_NAMESPACE" \
            --values apps/booking/k8s/values.yaml \
            --values apps/booking/k8s/values-staging.yaml \
            --set image.repository=ghcr.io/onecare/booking \
            --set image.tag="$IMAGE_TAG" \
            --atomic
          kubectl rollout status deploy/booking -n "$STAGING_NAMESPACE" --timeout=120s
      - name: Deploy ics-hub (staging)
        run: |
          helm upgrade --install ics-hub $HELM_CHART \
            --namespace "$STAGING_NAMESPACE" \
            --values apps/ics-hub/k8s/values.yaml \
            --values apps/ics-hub/k8s/values-staging.yaml \
            --set image.repository=ghcr.io/onecare/ics-hub \
            --set image.tag="$IMAGE_TAG" \
            --atomic
          kubectl rollout status deploy/ics-hub -n "$STAGING_NAMESPACE" --timeout=120s
      - name: Smoke tests (staging)
        run: |
          bash scripts/ci/http_smoke.sh --base-url "${{ secrets.STAGING_BASE_URL }}" --expect 200 --endpoint /readyz --endpoint /healthz
      - name: SLO documentation guard
        run: bash scripts/ci/slo_guard.sh
      - name: Canary metric gates
        env:
          CANARY_PSI: ${{ secrets.CANARY_PSI }}
          CANARY_JS: ${{ secrets.CANARY_JS }}
          CANARY_FRESHNESS_MS: ${{ secrets.CANARY_FRESHNESS_MS }}
          CANARY_SHADOW_AGREEMENT: ${{ secrets.CANARY_SHADOW_AGREEMENT }}
          CANARY_OVERRIDE_REASON: ${{ secrets.CANARY_OVERRIDE_REASON }}
        run: bash scripts/ci/check_canary_gates.sh
      - name: Note staging summary
        run: |
          echo "### Staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Namespace: ${STAGING_NAMESPACE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"

  promote-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: ${{ inputs.promote_production }}
    environment:
      name: production
    env:
      KUBECONFIG: ${{ runner.temp }}/kubeconfig
      IMAGE_TAG: ${{ inputs.image_tag }}
      PROD_NAMESPACE: ${{ secrets.PROD_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_PRODUCTION }}" ]; then
            echo "KUBE_CONFIG_PRODUCTION secret missing" >&2
            exit 1
          fi
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 --decode > "$KUBECONFIG"
      - name: Validate production inputs
        run: |
          if [ -z "${PROD_NAMESPACE}" ]; then
            echo "PROD_NAMESPACE secret missing" >&2
            exit 1
          fi
          if [ -z "${{ secrets.PROD_BASE_URL }}" ]; then
            echo "PROD_BASE_URL secret missing" >&2
            exit 1
          fi
      - name: Promote orchestrator
        run: |
          helm upgrade --install orchestrator $HELM_CHART \
            --namespace "$PROD_NAMESPACE" \
            --values apps/orchestrator/k8s/values.yaml \
            --set image.repository=ghcr.io/onecare/orchestrator \
            --set image.tag="$IMAGE_TAG" \
            --atomic --create-namespace
          kubectl rollout status deploy/orchestrator -n "$PROD_NAMESPACE" --timeout=180s
      - name: Promote booking
        run: |
          helm upgrade --install booking $HELM_CHART \
            --namespace "$PROD_NAMESPACE" \
            --values apps/booking/k8s/values.yaml \
            --set image.repository=ghcr.io/onecare/booking \
            --set image.tag="$IMAGE_TAG" \
            --atomic
          kubectl rollout status deploy/booking -n "$PROD_NAMESPACE" --timeout=180s
      - name: Promote ics-hub
        run: |
          helm upgrade --install ics-hub $HELM_CHART \
            --namespace "$PROD_NAMESPACE" \
            --values apps/ics-hub/k8s/values.yaml \
            --set image.repository=ghcr.io/onecare/ics-hub \
            --set image.tag="$IMAGE_TAG" \
            --atomic
          kubectl rollout status deploy/ics-hub -n "$PROD_NAMESPACE" --timeout=180s
      - name: Production smoke tests
        run: |
          bash scripts/ci/http_smoke.sh --base-url "${{ secrets.PROD_BASE_URL }}" --expect 200 --endpoint /readyz --endpoint /healthz
      - name: Success summary
        run: |
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Namespace: ${PROD_NAMESPACE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
      - name: Rollback (on failure)
        if: failure()
        run: |
          echo "Attempting rollback" >&2
          helm rollback orchestrator --namespace "$PROD_NAMESPACE" || true
          helm rollback booking --namespace "$PROD_NAMESPACE" || true
          helm rollback ics-hub --namespace "$PROD_NAMESPACE" || true
