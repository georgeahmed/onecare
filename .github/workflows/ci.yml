name: CI

on:
  pull_request:
  push:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PRACTICE_ID: demo
      PY_SAFETY_GATE_URL: https://example.com/safety-gate
      NATS_URL: nats://127.0.0.1:4222
      BUS_IMPL: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache npm artifacts
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services-py/pyproject.toml', 'services-py/pdm.lock', 'services-py/poetry.lock', 'services-py/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install
        run: npm ci
      - name: Codegen check (no write)
        run: npm run codegen:check
      - name: Portal locale extraction (check)
        run: npm run i18n:portal:check
      - name: Verify schema contracts in sync
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/check_contracts_sync.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (flake detection)
        run: node scripts/ci/run-vitest-flake-check.mjs
        env:
          CI_FLAKE_RETRIES: '2'
      - name: Portal accessibility audit
        run: npm run a11y:portal
      - name: Python tests
        run: make py-test
      - name: Upload QA flake artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-vitest-flakes
          path: artifacts/qa
          if-no-files-found: ignore
      - name: Safety Gate evaluation metrics
        run: |
          python services-py/safety_gate_service/eval/run_eval.py --output artifacts/eval/safety_gate_metrics.json
      - name: Safety Gate drift guard
        run: |
          scripts/ci/check_safety_gate_drift.py --metrics artifacts/eval/safety_gate_metrics.json
      - name: Python dependency audit (pip-audit)
        run: |
          python -m pip install pip-audit==2.7.3
          pip-audit -r services-py/requirements-dev.txt --no-deps
      - name: Upload Safety Gate eval metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-gate-eval
          path: artifacts/eval
          if-no-files-found: warn
      - name: Platform checklist check (backend)
        run: bash scripts/ci/check_platform_checklists.sh
      - name: Platform checklist check (integrations)
        run: STRICT=1 bash scripts/ci/check_platform_checklists_team.sh team/integrations
      - name: Platform checklist check (devops-sre)
        run: STRICT=1 bash scripts/ci/check_platform_checklists_team.sh team/devops-sre
      - name: Platform checklist check (ml)
        run: STRICT=1 bash scripts/ci/check_platform_checklists_team.sh team/ml
      - name: Platform checklist check (frontend)
        run: STRICT=1 bash scripts/ci/check_platform_checklists_team.sh team/frontend
      - name: Platform checklist check (data-engineering)
        run: STRICT=1 bash scripts/ci/check_platform_checklists_team.sh team/data-engineering
      - name: Platform checklist check (qa-automation)
        run: STRICT=1 bash scripts/ci/check_platform_checklists_team.sh team/qa-automation
      - name: Generate SBOMs
        run: bash scripts/sbom-generate.sh artifacts/sbom
      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom
      - name: SLO guard
        run: bash scripts/ci/slo_guard.sh || echo "::warning title=SLO guard::SLO documentation check failed"

  sast:
    name: SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (Node)
        run: npm ci

      - name: Install dependencies (Python)
        run: pip install -r services-py/requirements-dev.txt

      - name: Run Semgrep
        id: semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/owasp-top-ten
          sarif: true
          json: true
          fail-on-results: false

      - name: Enforce Semgrep severity gates
        run: |
          python3 - <<'PY'
import json
from pathlib import Path

path = Path('semgrep.json')
if not path.exists():
    exit(0)
data = json.loads(path.read_text())
violations = [r for r in data.get('results', []) if r.get('extra', {}).get('severity') == 'ERROR']
if violations:
    for result in violations:
        rule = result.get('check_id')
        message = result.get('extra', {}).get('message', '')
        location = result.get('path'), result.get('start', {}).get('line')
        print(f"High severity finding: {rule} {location} - {message}")
    raise SystemExit(1)
PY

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep
          path: |
            semgrep.sarif
            semgrep.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript,python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  perf-checks:
    name: Perf Checks
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      PRACTICE_ID: demo
      PY_SAFETY_GATE_URL: https://example.com/safety-gate
      NATS_URL: nats://127.0.0.1:4222
      BUS_IMPL: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Triage flow load smoke
        run: node scripts/perf/triage_flow.js
        env:
          TRIAGE_FLOW_DURATION: '5'
          TRIAGE_FLOW_RATE: '8'
          TRIAGE_FLOW_OUTPUT: 'json'
          TRIAGE_FLOW_OUTPUT_PATH: triage-summary.json
      - name: Booking flow load smoke
        run: node scripts/perf/booking_flow.js
        env:
          BOOKING_FLOW_DURATION: '5'
          BOOKING_FLOW_RATE: '8'
          BOOKING_FLOW_CONFLICT_RATE: '0.15'
          BOOKING_FLOW_OUTPUT: 'json'
          BOOKING_FLOW_OUTPUT_PATH: booking-summary.json
      - name: Telephony parity check
        run: node scripts/perf/telephony_parity.js
        env:
          TELEPHONY_PARITY_CALLS: '200'
          TELEPHONY_PARITY_CONCURRENCY: '10'
          TELEPHONY_PARITY_CHUNKS: '3'
          TELEPHONY_PARITY_OUTPUT: 'json'
          TELEPHONY_PARITY_OUTPUT_PATH: telephony-summary.json
      - name: Validate performance thresholds
        run: node scripts/perf/check_ci_thresholds.js
        env:
          TRIAGE_FLOW_OUTPUT_PATH: triage-summary.json
          BOOKING_FLOW_OUTPUT_PATH: booking-summary.json
          TELEPHONY_PARITY_OUTPUT_PATH: telephony-summary.json
      - name: Upload performance summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-summaries
          path: |
            triage-summary.json
            booking-summary.json
            telephony-summary.json

  docker-images:
    name: Build & Publish Docker Images
    needs:
      - build-and-test
      - perf-checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: sigstore/cosign-installer@v3

      - name: Read package version
        id: version
        run: |
          if command -v node >/dev/null 2>&1; then
            VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "")
          else
            VERSION=""
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine push mode
        id: push
        run: |
          if [ -n "${REGISTRY}" ] && [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Registry push disabled::Docker registry secrets not configured; images will be built but not pushed."
          fi

      - name: Log in to registry
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Prepare image tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          IMAGE_PREFIX="${REGISTRY:+${REGISTRY}/}"
          SAFETY_TAGS="${IMAGE_PREFIX}onecare-safety-gate:${GITHUB_SHA}"
          SCRIBE_TAGS="${IMAGE_PREFIX}onecare-scribe:${GITHUB_SHA}"
          if [ -n "${VERSION}" ]; then
            SAFETY_TAGS="${SAFETY_TAGS}"$'\n'"${IMAGE_PREFIX}onecare-safety-gate:${VERSION}"
            SCRIBE_TAGS="${SCRIBE_TAGS}"$'\n'"${IMAGE_PREFIX}onecare-scribe:${VERSION}"
          fi
          SAFETY_PRIMARY=$(printf "%s\n" "${SAFETY_TAGS}" | head -n1)
          SCRIBE_PRIMARY=$(printf "%s\n" "${SCRIBE_TAGS}" | head -n1)
          {
            echo "safety<<'EOF'"
            echo "${SAFETY_TAGS}"
            echo "EOF"
            echo "scribe<<'EOF'"
            echo "${SCRIBE_TAGS}"
            echo "EOF"
            echo "safety_primary=${SAFETY_PRIMARY}"
            echo "scribe_primary=${SCRIBE_PRIMARY}"
          } >> "$GITHUB_OUTPUT"

      - name: Build safety-gate image
        id: build_safety
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services-py/safety_gate_service/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.push.outputs.enabled == 'true' }}
          tags: ${{ steps.tags.outputs.safety }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build scribe image
        id: build_scribe
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services-py/scribe_service/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.push.outputs.enabled == 'true' }}
          tags: ${{ steps.tags.outputs.scribe }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign container images (cosign)
        if: steps.push.outputs.enabled == 'true'
        env:
          COSIGN_YES: "true"
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          sign_tags() {
            local tags="$1"
            if [ -z "${tags}" ]; then
              return
            fi
            while IFS= read -r tag; do
              if [ -z "${tag}" ]; then
                continue
              fi
              if [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
                cosign sign --key env://COSIGN_PRIVATE_KEY "${tag}"
              else
                cosign sign "${tag}"
              fi
            done <<< "${tags}"
          }
          sign_tags "${{ steps.tags.outputs.safety }}"
          sign_tags "${{ steps.tags.outputs.scribe }}"

      - name: Generate SLSA provenance (safety-gate)
        if: steps.push.outputs.enabled == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.tags.outputs.safety_primary }}
          subject-digest: ${{ steps.build_safety.outputs.digest }}

      - name: Generate SLSA provenance (scribe)
        if: steps.push.outputs.enabled == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.tags.outputs.scribe_primary }}
          subject-digest: ${{ steps.build_scribe.outputs.digest }}

      - name: Trivy image scan (safety-gate)
        if: steps.push.outputs.enabled == 'true'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.tags.outputs.safety_primary }}
          format: json
          output: trivy-safety-image.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy image scan (scribe)
        if: steps.push.outputs.enabled == 'true'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.tags.outputs.scribe_primary }}
          format: json
          output: trivy-scribe-image.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload container scan reports
        if: steps.push.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-security-reports
          path: |
            trivy-safety-image.json
            trivy-scribe-image.json

  security-scans:
    name: Security Scans
    needs:
      - build-and-test
      - sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: npm audit (high severity)
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          status=$?
          if [ ! -s npm-audit.json ]; then
            echo '{}' > npm-audit.json
          fi
          if [ $status -ne 0 ]; then
            echo "npm audit returned exit code $status (captured for policy enforcement)"
          fi
          exit 0

      - name: License policy check
        run: |
          set +e
          npx --yes license-checker --production --json > license-report.json
          status=$?
          if [ ! -s license-report.json ]; then
            echo '{}' > license-report.json
          fi
          if [ $status -ne 0 ]; then
            echo "license-checker returned exit code $status (captured for policy enforcement)"
          fi
          exit 0

      - name: pip-audit (services-py)
        run: |
          set +e
          pip-audit -r services-py/requirements-dev.txt -f json -o pip-audit.json
          status=$?
          if [ ! -s pip-audit.json ]; then
            echo '[]' > pip-audit.json
          fi
          if [ $status -ne 0 ]; then
            echo "pip-audit returned exit code $status (captured for policy enforcement)"
          fi
          exit 0

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          format: json
          output: trivy-results.json
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Enforce security policy
        run: |
          node scripts/ci/enforce_security_policy.mjs \
            --policy config/security/vuln-policy.json \
            --license-policy config/security/license-policy.json \
            --npm npm-audit.json \
            --pip pip-audit.json \
            --trivy trivy-results.json \
            --license license-report.json

      - name: gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --redact

      - name: Upload security scan artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            npm-audit.json
            license-report.json
            pip-audit.json
            trivy-results.json

  dast:
    name: DAST
    needs: build-and-test
    if: ${{ secrets.DAST_TARGET_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        id: zap
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: ${{ secrets.DAST_TARGET_URL }}
          cmd_options: "-I -j -m 5"

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap
          path: |
            zap-baseline-report.html
            zap-baseline-report.json
