name: Analytics Playback

on:
  pull_request:
    paths:
      - 'scripts/bench/analytics_playback.js'
      - 'scripts/bench/analytics_load_gen.js'
      - 'fixtures/analytics/**'
      - 'apps/analytics/**'
      - 'docs/ANALYTICS*.md'
      - '.github/workflows/analytics-playback.yml'
  push:
    branches: [ main, dev ]
    paths:
      - 'scripts/bench/analytics_playback.js'
      - 'fixtures/analytics/**'
      - '.github/workflows/analytics-playback.yml'

jobs:
  playback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install production dependencies
        run: npm ci --omit=dev
      - name: Run analytics playback harness
        run: >
          node scripts/bench/analytics_playback.js
          --fixtures fixtures/analytics/metrics-happy.json,fixtures/analytics/metrics-edge.json
          --output var/analytics/playback-ci.jsonl
      - name: Print playback summary
        run: cat var/analytics/playback-ci.jsonl | head -n 5 || true
