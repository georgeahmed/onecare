apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: example-bootstrap-token
  namespace: default
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
spec:
  template:
    metadata:
      name: example-bootstrap-token
      namespace: default
    type: Opaque
  encryptedData:
    token: AgA2exampleENCODEDVALUE==
---
# To regenerate:
#   kubectl create secret generic example-bootstrap-token \
#     --namespace default \
#     --from-literal=token=REPLACE_ME \
#     --dry-run=client -o yaml \
#     | kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets \
#     > infra/secrets/sealedsecret-example.yaml
