global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alerts/*.yaml

scrape_configs:
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8888
    relabel_configs:
      - source_labels: [__name__]
        regex: '.*_bucket'
        action: keep
      - source_labels: [le]
        regex: '([0-9]+(\.[0-9]+)?)'
        action: replace
        target_label: le
      - action: labeldrop
        regex: '(pod|container|instance_id|id|traceId|spanId)'

  - job_name: services
    honor_timestamps: true
    static_configs:
      - targets:
          - orchestrator:9464
          - analytics:9464
          - booking:9464
    metric_relabel_configs:
      - action: labeldrop
        regex: '(?i)(user|email|token|password|secret|authorization|session)'
      - action: labeldrop
        regex: '(?i)(trace.*|span.*|request.*|correlation.*)'
      - source_labels: [__name__]
        regex: '(http_server_duration_(bucket|sum|count)|booking_http_.+|gp_connect_.+|booking_event_.+)'
        action: keep
