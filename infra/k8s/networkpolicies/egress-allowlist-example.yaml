apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: booking-egress-allowlist
  namespace: booking
spec:
  podSelector:
    matchLabels:
      app: booking
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    - to:
        - ipBlock:
            cidr: 203.0.113.0/24
          namespaceSelector:
            matchLabels:
              onecare.io/egress-group: gp-connect
      ports:
        - protocol: TCP
          port: 443
