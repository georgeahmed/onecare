apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: booking-mtls
  namespace: booking
spec:
  secretName: booking-mtls-cert
  duration: 720h # 30 days
  renewBefore: 168h
  commonName: booking.booking.svc.cluster.local
  dnsNames:
    - booking.booking.svc.cluster.local
    - booking
  issuerRef:
    kind: ClusterIssuer
    name: onecare-internal-ca
