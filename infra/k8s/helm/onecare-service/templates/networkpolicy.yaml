{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "onecare-service.fullname" . }}
  labels:
    {{- include "onecare-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "onecare-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- if .Values.networkPolicy.ingress.enabled }}
    - Ingress
    {{- end }}
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  {{- if .Values.networkPolicy.ingress.enabled }}
  ingress:
    {{- if .Values.networkPolicy.ingress.from }}
    - from:
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
    {{- else }}
    - {}
    {{- end }}
  {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    - to:
        {{- toYaml .Values.networkPolicy.egress.to | nindent 8 }}
  {{- end }}
{{- end }}
