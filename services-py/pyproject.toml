[project]
name = "onecare-ml-services"
version = "0.1.0"
description = "ONECARE ML-oriented microservices (safety gate, scribe)"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2.0"
]

[tool.uvicorn]
factory = false

[project.optional-dependencies]
dev = [
  "black==24.8.0",
  "ruff==0.6.8",
  "pytest==8.3.2",
  "httpx==0.27.2"
]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = []
target-version = "py310"
exclude = [".venv", "dist", "node_modules"]
