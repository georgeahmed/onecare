[project]
name = "onecare-ml-services"
version = "0.1.0"
description = "ONECARE ML-oriented microservices (safety gate, scribe)"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.109.2",
  "uvicorn==0.37.0",
  "pydantic==2.12.3",
  "prometheus-client==0.20.0",
  "langdetect==1.0.9"
]

[tool.setuptools]
include-package-data = true
packages = [
  "common",
  "models",
  "safety_gate_service",
  "scribe_service",
  "triage_dataset"
]
py-modules = [
  "security_utils",
  "train_acuity"
]

[tool.uvicorn]
factory = false

[project.optional-dependencies]
dev = [
  "black==24.8.0",
  "ruff==0.6.8",
  "pytest==8.3.2",
  "httpx==0.27.2"
]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = []
target-version = "py310"
exclude = [".venv", "dist", "node_modules"]
