# Template: Feature view materialiser alerts
# Purpose: Ensure sliding-window feature views continue to materialise on schedule and within duration budgets.
# Replace the {{ ... }} placeholders with concrete values for your environment before applying.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{RULE_NAME}}
  labels:
    team: "{{TEAM_LABEL}}"
    service: "{{SERVICE_LABEL}}"
    env: "{{ENVIRONMENT_LABEL}}"
spec:
  groups:
    - name: feature-views.materialiser
      rules:
        - alert: FeatureViewMaterialiserStalled
          expr: |
            increase(analytics_ingest_ok_total{metricName="{{VIEW_LABEL}}", env="{{ENVIRONMENT_LABEL}}"}[{{STALL_WINDOW}}]) == 0
          for: {{STALL_FOR}}
          labels:
            severity: "{{STALL_SEVERITY}}"
            component: "feature-views"
            env: "{{ENVIRONMENT_LABEL}}"
            team: "{{TEAM_LABEL}}"
          annotations:
            summary: "Feature view materialiser stalled ({{VIEW_LABEL}})"
            description: |-
              No successful materialiser runs for view {{VIEW_LABEL}} in the past {{STALL_WINDOW}}.
              Investigate the pipeline (npm run feature:views -- --view {{VIEW_LABEL}} --online) and confirm the offline dataset is available.
            runbook: "https://onecare/runbooks/feature-views"
            dashboard: "{{DASHBOARD_URL}}"
        - alert: FeatureViewMaterialiserSlow
          expr: |
            histogram_quantile(
              {{DURATION_QUANTILE}},
              sum(
                rate(analytics_ingest_lag_ms_bucket{metricName="{{VIEW_LABEL}}", env="{{ENVIRONMENT_LABEL}}"}[{{DURATION_WINDOW}}])
              ) by (le)
            ) > {{DURATION_THRESHOLD_MS}}
          for: {{DURATION_FOR}}
          labels:
            severity: "{{DURATION_SEVERITY}}"
            component: "feature-views"
            env: "{{ENVIRONMENT_LABEL}}"
            team: "{{TEAM_LABEL}}"
          annotations:
            summary: "Feature view materialiser running slow ({{VIEW_LABEL}})"
            description: |-
              The p{{DURATION_QUANTILE_PERCENT}} duration for view {{VIEW_LABEL}} exceeded {{DURATION_THRESHOLD_MS}} ms over {{DURATION_WINDOW}}.
              Review recent runs, check upstream data volume, and ensure the job has sufficient resources.
            runbook: "https://onecare/runbooks/feature-views"
            dashboard: "{{DASHBOARD_URL}}"
