alert: ICSRoutingLatencyHigh
expr: |
  histogram_quantile(0.95, sum(rate(ics_routing_latency_ms_bucket[5m])) by (le)) > 0.04
for: 10m
labels:
  severity: warning
  service: ics-hub
annotations:
  summary: "ICS Hub routing latency p95 above 40ms"
  description: "Routing decisions are slower than target. Investigate backpressure or downstream slowness."
